<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="404" viewBox="0 0 1000 404" role="img" aria-labelledby="title desc">
  <title id="title">VASP Band Agent bounded autonomy architecture</title>
  <desc id="desc">Human signs an immutable contract once, Maker orchestrates within bounds, isolated read-only Checker audits snapshots with deterministic program veto, Remote HPC runs hash-locked VASP stages, and watch wait blocks at zero LLM tokens until wakeup.</desc>
  <defs>
    <marker id="arr-indigo" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#5b46c4" stroke-width="1.6"/></marker>
    <marker id="arr-navy" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#1f4e79" stroke-width="1.6"/></marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#b45309" stroke-width="1.6"/></marker>
    <marker id="arr-teal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#13958d" stroke-width="1.6"/></marker>
    <marker id="arr-emerald" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#0f766e" stroke-width="1.6"/></marker>
    <marker id="arr-cyan" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#0e7490" stroke-width="1.6"/></marker>
  </defs>

  <rect width="1000" height="404" rx="18" fill="#f6f9fc"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <!-- Header -->
    <text x="24" y="32" fill="#62758a" font-size="11.5" font-weight="700" letter-spacing="1.4">BOUNDED AUTONOMY LOOP</text>
    <text x="976" y="32" fill="#62758a" font-size="12" text-anchor="end">Approve once · Isolated Maker–Checker · 0-token cluster waiting</text>

    <!-- Arrows -->
    <g fill="none" stroke-width="2" stroke-linecap="round">
      <!-- Operator -> Contract -->
      <path d="M284 104 H362" stroke="#5b46c4" marker-end="url(#arr-indigo)"/>
      <!-- Contract -> Maker -->
      <path d="M452 154 V242" stroke="#1f4e79" marker-end="url(#arr-navy)"/>
      <!-- Maker -> Checker (top) & Checker -> Maker (bottom) -->
      <path d="M368 284 H290" stroke="#b45309" marker-end="url(#arr-amber)"/>
      <path d="M284 314 H362" stroke="#13958d" marker-end="url(#arr-teal)"/>
      <!-- Maker -> Remote HPC -->
      <path d="M632 298 H710" stroke="#0f766e" marker-end="url(#arr-emerald)"/>
      <!-- Remote HPC -> watch wait -->
      <path d="M874 248 V160" stroke="#0e7490" marker-end="url(#arr-cyan)"/>
      <!-- watch wait -> Maker (orthogonal rounded elbow) -->
      <path d="M752 154 V192 Q752 201 743 201 H587 Q578 201 578 210 V242" stroke="#0e7490" marker-end="url(#arr-cyan)"/>
    </g>

    <!-- Edge labels & pills -->
    <g font-size="11.5" font-weight="600" text-anchor="middle">
      <text x="326" y="94" fill="#5b46c4">Signs once</text>
      <text x="326" y="274" fill="#b45309">Coords only</text>
      <text x="326" y="332" fill="#13958d">Lease / Veto</text>
      <text x="674" y="288" fill="#0f766e">Submit</text>

      <rect x="384" y="189" width="136" height="24" rx="12" fill="#ffffff" stroke="#cfdce8"/>
      <text x="452" y="205" fill="#1f4e79">Gates every stage</text>

      <rect x="602" y="189" width="128" height="24" rx="12" fill="#ffffff" stroke="#bae6fd"/>
      <text x="666" y="205" fill="#0e7490">0-token wakeup</text>

      <rect x="806" y="189" width="136" height="24" rx="12" fill="#ffffff" stroke="#bae6fd"/>
      <text x="874" y="205" fill="#0e7490">Outbox events</text>
    </g>

    <!-- Row 1 Cards -->
    <!-- 01 Operator -->
    <rect x="20" y="54" width="264" height="100" rx="12" fill="#f6f4ff" stroke="#d4cbf8"/>
    <text x="38" y="78" fill="#5b46c4" font-size="11" font-weight="700" letter-spacing="1.1">01 · HUMAN AUTHORITY</text>
    <text x="38" y="104" fill="#16324f" font-size="17" font-weight="700">Operator (Local TTY)</text>
    <text x="38" y="125" fill="#475569" font-size="12">vasp-ctl contract approve</text>
    <text x="38" y="142" fill="#64748b" font-size="11.5">Real TTY · optional SSH signature</text>

    <!-- 02 Contract & Ledger -->
    <rect x="368" y="54" width="264" height="100" rx="12" fill="#ffffff" stroke="#cfdce8"/>
    <text x="386" y="78" fill="#1f4e79" font-size="11" font-weight="700" letter-spacing="1.1">02 · IMMUTABLE GATE</text>
    <text x="386" y="104" fill="#16324f" font-size="17" font-weight="700">Contract &amp; Ledger</text>
    <text x="386" y="125" fill="#475569" font-size="12">Physics, precision &amp; Slurm bounds</text>
    <text x="386" y="142" fill="#64748b" font-size="11.5">FileLock ledger · one-way halt</text>

    <!-- 05 watch wait -->
    <rect x="716" y="54" width="264" height="100" rx="12" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="734" y="78" fill="#0e7490" font-size="11" font-weight="700" letter-spacing="1.1">05 · EVENT-DRIVEN WAIT</text>
    <text x="734" y="104" fill="#16324f" font-size="17" font-weight="700">vasp-ctl watch wait</text>
    <text x="734" y="125" fill="#475569" font-size="12">0 LLM tokens while Slurm runs</text>
    <text x="734" y="142" fill="#64748b" font-size="11.5">Terminal/error wake · failover</text>

    <!-- Row 2 Cards -->
    <!-- 03 Checker -->
    <rect x="20" y="248" width="264" height="100" rx="12" fill="#fffaf0" stroke="#f0d49a"/>
    <text x="38" y="272" fill="#b45309" font-size="11" font-weight="700" letter-spacing="1.1">03 · INDEPENDENT AUDIT</text>
    <text x="38" y="298" fill="#16324f" font-size="17" font-weight="700">Checker (vasp-reviewer)</text>
    <text x="38" y="319" fill="#475569" font-size="12">Read-only MCP (11 tools, 0 shell)</text>
    <text x="38" y="336" fill="#64748b" font-size="11.5">Snapshot lease · program veto</text>

    <!-- Central Hub: Maker -->
    <rect x="368" y="248" width="264" height="100" rx="12" fill="#ffffff" stroke="#13958d" stroke-width="2"/>
    <text x="386" y="272" fill="#13958d" font-size="11" font-weight="700" letter-spacing="1.1">ORCHESTRATOR · HUB</text>
    <text x="386" y="298" fill="#16324f" font-size="17" font-weight="700">Maker (AI Coding Agent)</text>
    <text x="386" y="319" fill="#475569" font-size="12">vasp-mcp --role maker (19 tools)</text>
    <text x="386" y="336" fill="#64748b" font-size="11.5">Plans, submits &amp; self-heals</text>

    <!-- 04 Remote HPC -->
    <rect x="716" y="248" width="264" height="100" rx="12" fill="#edf8f6" stroke="#b8ded7"/>
    <text x="734" y="272" fill="#0f766e" font-size="11" font-weight="700" letter-spacing="1.1">04 · COMPUTE EXECUTION</text>
    <text x="734" y="298" fill="#16324f" font-size="17" font-weight="700">Remote HPC (Slurm)</text>
    <text x="734" y="319" fill="#475569" font-size="12">Hash-locked VASP &amp; manifest.json</text>
    <text x="734" y="336" fill="#64748b" font-size="11.5">Converge, Relax, SCF, Bands, DOS</text>

    <!-- Footer -->
    <text x="500" y="382" fill="#62758a" font-size="12" text-anchor="middle">Green review → next stage   ·   Transient failure → bounded self-healing   ·   Violation or budget cap → one-way circuit break</text>
  </g>
</svg>
