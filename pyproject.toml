[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vasp-band-agent"
version = "0.7.0"
description = "Automated VASP band structure calculations with AI-assisted convergence, relaxation, SCF and Slurm workflows"
readme = "README.md"
keywords = ["vasp", "band-structure", "dft", "electronic-structure", "materials-science", "ai-agent", "slurm"]
requires-python = ">=3.11"
dependencies = ["pymatgen>=2025.1", "numpy>=1.26", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/jiafanlearner/vasp-band-agent"
Repository = "https://github.com/jiafanlearner/vasp-band-agent"
Documentation = "https://github.com/jiafanlearner/vasp-band-agent/blob/main/docs/README.md"
Issues = "https://github.com/jiafanlearner/vasp-band-agent/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3.5", "jsonschema>=4.20", "python-dotenv>=1.0", "prompt-toolkit>=3.0.48,<4", "rich>=13.9,<16"]
# Reuses one SSH connection per server; without it every remote call starts a new ssh process.
ssh = ["paramiko>=3.4"]
ai = ["openai>=1.68", "jsonschema>=4.20", "python-dotenv>=1.0", "prompt-toolkit>=3.0.48,<4", "rich>=13.9,<16"]

[project.scripts]
vasp-band-agent = "vasp_agent.chat.cli:workflow_main"
vasp-ai = "vasp_agent.chat.ai_agent:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vasp_agent*"]

[tool.setuptools.package-data]
# Workflow guides are read on demand by read_stage_guide.
"vasp_agent.guides" = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".agent/cache/pytest"

[tool.ruff]
target-version = "py311"
cache-dir = ".agent/cache/ruff"
extend-exclude = [".agent", ".claude", "downloads", "runs", "reports", "workbench", "potentials", "docs"]

[tool.ruff.lint]
# Minimal non-intrusive gate: syntax errors and pyflakes (undefined names, unused imports, etc.).
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures imported across test modules trigger F401/F811 by design.
"tests/*.py" = ["F401", "F811"]
# Deliberate package-only re-exports and runtime dependency availability probes.
"src/vasp_agent/remote/remote_worker.py" = ["F401"]
"src/vasp_agent/chat/ai_agent.py" = ["F401"]
"src/vasp_agent/models/compaction_probe.py" = ["F401"]
